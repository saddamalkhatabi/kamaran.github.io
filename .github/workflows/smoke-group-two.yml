name: Group Two public mobile Chromium smoke
on:
  push:
    branches: [master]
    paths:
      - learn-english-preview/group-two.js
      - learn-english-preview/index.html
      - learn-english-preview/app.js
      - learn-english-preview/styles.css
      - learn-english-preview/data/group-two.json
      - learn-english-preview/data/group-two-audio-index.json
      - scripts/smoke_group_two.mjs
      - .github/workflows/smoke-group-two.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test both groups from the public static preview
        run: |
          (cd learn-english-preview && python -m http.server 3178 --bind 127.0.0.1 >/tmp/public-g2.log 2>&1) &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3178/index.html >/dev/null && break || sleep 1; done
          node scripts/smoke_group_two.mjs

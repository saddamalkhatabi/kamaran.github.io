name: Group Two public mobile Chromium smoke
on:
  push:
    branches: [master]
    paths:
      - learn-english-preview/group-two.js
      - learn-english-preview/index.html
      - learn-english-preview/app.js
      - learn-english-preview/styles.css
      - learn-english-preview/data/group-two.json
      - learn-english-preview/data/group-two-audio-index.json
      - scripts/smoke_group_two.mjs
      - .github/workflows/smoke-group-two.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test both groups from the public static preview
        run: |
          (cd learn-english-preview && python -m http.server 3178 --bind 127.0.0.1 >/tmp/public-g2.log 2>&1) &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3178/index.html >/dev/null && break || sleep 1; done
          node scripts/smoke_group_two.mjs 2>&1 | tee /tmp/group-two-public-smoke.log

      - name: Record successful real-browser acceptance check
        run: |
          mkdir -p reports
          printf '{"status":"passed","run_id":"%s","source_sha":"%s","test":"group-two-mobile-chromium","browser":"chromium"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" > reports/group-two-public-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/group-two-public-smoke.json
          if ! git diff --cached --quiet; then
            git commit -m 'Attest Group Two mobile browser acceptance [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Record failed browser trace for actionable repair
        if: failure()
        run: |
          mkdir -p reports
          if [ -f /tmp/group-two-public-smoke.log ]; then tail -n 65 /tmp/group-two-public-smoke.log > reports/group-two-public-smoke-error.txt; else echo 'No browser trace; inspect runner setup' > reports/group-two-public-smoke-error.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/group-two-public-smoke-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Group Two public smoke trace for review [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
